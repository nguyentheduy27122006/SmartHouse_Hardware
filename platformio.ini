; PlatformIO Project Configuration File - SmartHouseV4 (ESP8266 NodeMCU v2)
; Cấu hình chuyên biệt cho vi điều khiển ESP8266 NodeMCU (ESP-12E) ở cả 3 tầng

[platformio]
src_dir = .
default_envs = tang1_nodemcu

[common]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.14

; ==================== TẦNG 1 (ESP8266 NodeMCU) ====================
[env:tang1_nodemcu]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = +<tang_1/*>
lib_deps =
    ${common.lib_deps}
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    chris--a/Keypad @ ^3.1.1
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ==================== TẦNG 2 (ESP8266 NodeMCU) ====================
[env:tang2_nodemcu]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = +<tang_2/*>
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.10

; ==================== TẦNG 3 (ESP8266 NodeMCU) ====================
[env:tang3_nodemcu]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = +<tang_3/*>
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
