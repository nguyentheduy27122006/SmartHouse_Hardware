; PlatformIO Project Configuration File - SmartHouseV4 (ESP8266 NodeMCU v2)
; Cấu hình cho 3 mạch vi điều khiển ESP8266 NodeMCU (ESP-12E):
;   1. tang_1.1: Cửa Garage, Quạt, Đèn LED Tầng 1, DHT11 + LCD 16x2, Báo trộm nhà xe
;   2. tang_1.2: Cửa chính (Keypad 4x4 + LCD 16x2 + Servo) & Thang máy (L298N)
;   3. tang_2_3: Đèn LED Tầng 2, Báo cháy MQ-2 + OLED 0.96", Khóa vân tay AS608 + Servo Tầng 3

[platformio]
src_dir = .
default_envs = tang1_1_nodemcu

[common]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

; ==================== MẠCH 1: TẦNG 1.1 (ESP8266 NodeMCU) ====================
[env:tang1_1_nodemcu]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = -<*> +<tang_1_1.ino>
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ==================== MẠCH 2: TẦNG 1.2 (ESP8266 NodeMCU) ====================
[env:tang1_2_nodemcu]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = -<*> +<tang_1_2.ino>
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    chris--a/Keypad @ ^3.1.1

; ==================== MẠCH 3: TẦNG 2 & 3 (ESP8266 NodeMCU) ====================
[env:tang2_3_nodemcu]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = -<*> +<tang_2_3.ino>
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
